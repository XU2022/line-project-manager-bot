server {
    listen 443 ssl http2;
    server_name line.example.com;

    # Configure certificate paths using your certificate provider.
    ssl_certificate /etc/letsencrypt/live/line.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/line.example.com/privkey.pem;

    location = /webhook {
        proxy_pass http://127.0.0.1:8646/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_request_headers on;
        client_max_body_size 1m;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8646/healthz;
    }
}
